<nav class="group/nav relative mx-auto flex max-w-5xl flex-wrap items-center gap-x-1 gap-y-3 pt-10 pb-4 sm:gap-x-6 lg:flex-nowrap lg:gap-8 lg:pt-11 lg:pb-5" aria-label="Main navigation" x-data="navigation" :data-search-open="searchOpen ? '' : null" @click.outside="open = false" @keydown.escape.window="close()">
    <div class="text-xl leading-[1.3] font-extrabold tracking-[-0.055em] max-sm:group-data-search-open/nav:invisible">
        <a href="/" class="inline-flex min-h-12 items-center" aria-label="{{ settings:site_name }} homepage">{{ settings:site_name }}</a>
    </div>
    {{ partial:nav_search placement="mobile" }}
    {{ partial:theme_switch placement="mobile" }}
    <button type="button" class="order-4 inline-flex h-12 w-11 shrink-0 items-center justify-center lg:hidden" x-ref="toggle" @click="closeSearch(false); open = ! open" :aria-expanded="open.toString()" aria-expanded="false" aria-controls="site-navigation" :aria-label="open ? 'Close menu' : 'Open menu'" aria-label="Open menu">
        <svg x-show="! open" viewBox="0 0 20 20" aria-hidden="true" class="size-5 fill-current">
            <path d="M0 3h20v2H0V3zm0 6h20v2H0V9zm0 6h20v2H0v-2z" />
        </svg>
        <svg x-show="open" x-cloak viewBox="0 0 20 20" aria-hidden="true" class="size-5 fill-current">
            <path d="M10 8.586L2.929 1.515 1.515 2.929 8.586 10l-7.071 7.071 1.414 1.414L10 11.414l7.071 7.071 1.414-1.414L11.414 10l7.071-7.071-1.414-1.414L10 8.586z" />
        </svg>
    </button>
    <div id="site-navigation" class="order-5 flex basis-full flex-col gap-1 py-4 motion-reduce:transition-none! motion-reduce:duration-0! lg:order-2 lg:ml-auto lg:basis-auto lg:flex-row lg:gap-8 lg:py-0" x-ref="links" x-show="desktop || open" :inert="! desktop && ! open" x-transition.opacity.duration.180ms x-cloak>
        {{ nav }}
            <a href="{{ url }}" class="relative w-fit py-2.5 text-gray-600 after:invisible after:absolute after:bottom-0 after:left-0 after:h-[0.4rem] after:w-[min(100%,4rem)] after:bg-teal after:content-[''] after:[mask:url(../../public/assets/site/underline.svg)_left_center/contain_no-repeat] hover:text-gray-900 hover:after:visible focus-visible:after:visible aria-[current]:text-gray-900 aria-[current]:after:visible dark:text-gray-300 dark:after:bg-teal-light dark:hover:text-gray-100 dark:aria-[current]:text-gray-100" {{ if is_current }}aria-current="page"{{ elseif is_parent }}aria-current="true"{{ /if }}>{{ title }}</a>
        {{ /nav }}
    </div>
    {{ partial:nav_search placement="desktop" }}
    {{ partial:theme_switch placement="desktop" }}
</nav>
